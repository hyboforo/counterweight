# counterweight-agent — one till's printer.
#
# Copy to  C:\ProgramData\Counterweight\agent.properties  and edit. Everything
# here has a working default; the two lines that actually matter on install day
# are `printer` and `allowedOrigins`.

# ── The printer ───────────────────────────────────────────────────────────
# spooler : USB, through the Windows print queue. What a Syncotek on USB uses.
# tcp     : a network printer listening on raw 9100.
# file    : a device path (\.\COM3) or a plain file, for serial and for tests.
transport=spooler

# The queue name exactly as Windows lists it. `GET /v1/printers` prints the
# list this machine has; the Syncotek driver usually installs as
# "80mm Series Printer". Leave empty to use the machine's default printer,
# which is a habit worth avoiding — the default is whatever somebody last
# clicked in Word.
printer=80mm Series Printer

# transport=tcp
#host=192.168.1.50
#printerPort=9100

# transport=file
#path=\\.\COM3

# ── Who may print ─────────────────────────────────────────────────────────
# The agent listens on 127.0.0.1, so any page open in the cashier's browser can
# reach it. Loopback origins are always allowed; the shop server's origin has
# to be named here. A refusal is logged with the origin it refused, so if
# printing stops after the server moves, the log says what to paste in.
allowedOrigins=http://192.168.1.10:8080

# Optional shared secret, sent as X-Counterweight-Agent-Token. Leave empty
# until the server hands the token to the till page — switching it on before
# that stops every receipt in the shop.
#token=

# ── Housekeeping ──────────────────────────────────────────────────────────
# Every job is written here before anything reaches the printer, and is not
# deleted afterwards. That is what makes a jam recoverable and "print it
# again" a lookup.
#spoolDir=C:/ProgramData/Counterweight/spool
#port=9110
