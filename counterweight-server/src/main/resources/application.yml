spring:
  application:
    name: counterweight-server

  datasource:
    # Local development. In the shop this points at PostgreSQL on the same
    # machine — see docs/architecture.html §3.
    url: jdbc:postgresql://localhost:5434/counterweight
    username: counterweight
    password: counterweight
    hikari:
      # A shop runs a handful of tills, not a web tier. A small pool keeps
      # connection count predictable on modest hardware.
      maximum-pool-size: 10
      minimum-idle: 2

  flyway:
    enabled: true
    locations: classpath:db/migration
    # The baseline is the schema of record. Nothing is auto-generated.
    baseline-on-migrate: false

  jpa:
    open-in-view: false
    hibernate:
      # Never let Hibernate touch the schema. Flyway owns it, and the ledger
      # depends on triggers and check constraints that ddl-auto would not
      # reproduce.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          # Batch inserts matter for goods receipt with long line counts.
          batch_size: 50

  jackson:
    default-property-inclusion: non_null

server:
  port: 8080
  error:
    # Never let the default whitelabel handler leak a stack trace or the
    # exception class; GlobalExceptionHandler owns the error contract.
    include-stacktrace: never
    include-message: never
    include-exception: false
  # A request line longer than this is not a real till request.
  max-http-request-header-size: 16KB

springdoc:
  # Developer tooling. Turn off in the shop — an unauthenticated schema dump
  # tells an attacker exactly which endpoints exist.
  api-docs:
    enabled: ${COUNTERWEIGHT_API_DOCS:true}
  swagger-ui:
    enabled: ${COUNTERWEIGHT_API_DOCS:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

counterweight:
  branch-code: MAIN

  # Who the first two accounts are. Used once, on a database with no users at
  # all — see InitialAdminBootstrap, which is not a reconciler and will not
  # re-create an account somebody deliberately removed.
  bootstrap:
    owner-username: ${COUNTERWEIGHT_OWNER_USERNAME:owner}
    owner-name: ${COUNTERWEIGHT_OWNER_NAME:Hanan Yaro}
    owner-phone: ${COUNTERWEIGHT_OWNER_PHONE:0264164445}
    owner-email: ${COUNTERWEIGHT_OWNER_EMAIL:hyboforo@gmail.com}

  auth:
    # MUST come from the environment. The application refuses to start if this
    # is blank, shorter than 32 bytes, or still the placeholder — see
    # JwtService.verifySecret(). Generate one with: openssl rand -base64 48
    jwt-secret: ${COUNTERWEIGHT_JWT_SECRET:}
    issuer: counterweight
    access-token-minutes: 15
    refresh-token-days: 7
    lockout-max-attempts: 5
    lockout-minutes: 15
    pin-max-attempts: 3
    pin-lockout-minutes: 30
    password-min-length: 10
  # Settings the SHOP decides live in `app_config`, not here: rounding
  # increment, paper width, expiry horizons, reorder terms, variance
  # thresholds, backup window. This file holds only what the machine needs to
  # start — a signing key that could be changed from a settings screen would
  # not be a signing key, and a datasource URL is needed before there is a
  # database to read one from. See ConfigService.

  printing:
    # How many times a till may hand a print job back before it stops being
    # retried. A tuning knob for this process, not a decision the shop makes.
    max-attempts: 5

logging:
  level:
    root: INFO
    com.counterweight: DEBUG
